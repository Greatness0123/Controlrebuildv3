name: Build Desktop App

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: windows
            python_zip: python-windows.zip
          - os: macos-latest
            platform: macos
            python_zip: python-macos.zip
          - os: ubuntu-latest
            platform: linux
            python_zip: python-linux.zip

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Setup assets directories
        run: |
          mkdir -p assets/binaries
          mkdir -p assets/vosk
        shell: bash

      - name: Download and extract Vosk model
        run: |
          curl -L -o vosk-model.zip "https://github.com/Greatness0123/Controlrebuildv3/releases/download/assets/vosk-model.zip"
          unzip -o vosk-model.zip -d assets/
          rm vosk-model.zip
        shell: bash

      - name: Download and extract platform-specific Python binaries
        if: matrix.python_zip != ''
        run: |
          mkdir -p assets/binaries
          curl -L -o python.zip "https://github.com/Greatness0123/Controlrebuildv3/releases/download/assets/${{ matrix.python_zip }}"
          unzip -o python.zip -d assets/binaries/
          rm python.zip
        shell: bash

      - name: Verify assets structure
        run: |
          echo "=== Assets directory ==="
          ls -la assets/
          echo "=== Vosk model (if exists) ==="
          ls -la assets/vosk-model* 2>/dev/null || echo "No vosk model found"
          echo "=== Binaries directory ==="
          ls -la assets/binaries/ 2>/dev/null || echo "No binaries found"
        shell: bash

      - name: Install dependencies
        run: npm ci
        shell: bash

      - name: Post-install hook
        run: npm run postinstall
        shell: bash

      - name: Build the Electron app
        run: npm run build
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows artifacts
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            dist/win-unpacked/
            dist/*.exe
          retention-days: 7
          compression-level: 0

      - name: Upload macOS artifacts
        if: matrix.platform == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: |
            dist/mac/
            dist/*.dmg
          retention-days: 7
          compression-level: 0

      - name: Upload Linux artifacts
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: |
            dist/linux-unpacked/
            dist/*.AppImage
            dist/*.deb
          retention-days: 7
          compression-level: 0

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/**/*
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}